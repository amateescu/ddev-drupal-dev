name: tests
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "zensical.toml"
      - ".github/workflows/docs.yml"

  schedule:
    - cron: '25 08 * * *'

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Enable remote debugging session
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancelled runs show up as "failing" in the README badge, so let runs on
  # main queue up instead of cancelling each other.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.ddev_version }}, ${{ matrix.group }})
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Pull requests run against DDEV stable only. The nightly run and pushes
        # to main also run against DDEV HEAD, to catch DDEV changes that break
        # the add-on.
        ddev_version: ${{ fromJSON(github.event_name == 'pull_request' && '["stable"]' || '["stable", "HEAD"]') }}
        # The tests run in two jobs side by side, each with a project of its own.
        # "module management" is tagged "modules" and takes about as long as all
        # the other tests together. A test without a tag runs in the "core" job.
        group: [core, modules]
        include:
          - group: core
            filter: '!modules'
          - group: modules
            filter: modules
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}
          # Release tests install the latest published release, so pull requests
          # and pushes skip them, the same as the action does without a
          # test_command.
          test_command: bats tests --filter-tags ${{ matrix.filter }}${{ (github.event_name == 'pull_request' || github.event_name == 'push') && ',!release' || '' }}
